<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Verify Your Account - {{ project_name }}</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style type="text/css">
        body { margin:0; padding:0; background-color:#f8fafc; font-family: 'Inter', Arial, sans-serif; }
        table, td { border-collapse:collapse; }
        .container { max-width: 580px; margin: 30px auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, #4F46E5 0%, #6366F1 100%); padding: 35px 20px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 700; }
        .body { padding: 40px 30px; color: #334155; line-height: 1.6; }
        .btn { display: inline-block; background-color: #4F46E5; color: #ffffff !important; padding: 14px 28px; font-weight: 600; text-decoration: none; border-radius: 8px; margin: 25px 0; }
        .footer { background: #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ project_name }}</h1>
        </div>
        <div class="body">
            <h2>Verify Your Email Address</h2>
            <p>Welcome to {{ project_name }}! Please confirm your email address by clicking the button below:</p>
            <div style="text-align: center;">
                <a href="{{ link }}" class="btn">Verify Account</a>
            </div>
            <p style="font-size: 13px; color: #64748b;">If the button above does not work, copy and paste this link into your browser:<br><a href="{{ link }}">{{ link }}</a></p>
        </div>
        <div class="footer">
            &copy; {{ project_name }}. All rights reserved.
        </div>
    </div>
</body>
</html>
