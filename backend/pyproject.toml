[project]
name = "knowit-backend"
version = "0.1.0"
description = "KnowIT RAG Application Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.8.0",
    "structlog>=24.1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "pgvector>=0.2.5",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "email-validator>=2.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
